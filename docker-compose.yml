services:
  cookie-talk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cookie-talk
    restart: unless-stopped
    ports:
      - "${PORT:-7418}:7418"
    environment:
      - PORT=7418
      - NODE_ENV=production
    volumes:
      # Постоянное хранилище для SQLite базы данных
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7418/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
